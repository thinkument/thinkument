[tool.poetry]
name = "thinkument-sdk"
version = "0.1.0"
description = "Official Thinkument Client SDK for Python (Generated from OpenAPI 3.1)"
authors = ["Thinkument Team <team@thinkument.com>"]
readme = "README.md"
license = "Apache-2.0"
packages = [
    { include = "thinkument_sdk" }
]

[tool.poetry.dependencies]
python = "^3.10"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
