[package]
name = "thinkument"
version = "0.1.0"
edition = "2021"
description = "Official Thinkument Client SDK for Rust"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
